<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D object on scroll</title>
<!--
  DEMO: a Three.js object whose pose is driven by scroll, with pointer tilt.

  Section map
    1. Tokens          — demo values; the 3D colours are read from these tokens, not hard-coded.
    2. Layout          — tall track + sticky canvas; chapter text in normal flow on top.
    3. Markup          — canvas is decorative (aria-hidden); the story lives in the HTML text.
    4. Script (ES module, importmap → exact three version)
       4a. capability  — no WebGL → static fallback; reduced motion → one still frame.
       4b. renderer    — DPR capped at 1.75, antialias only when DPR < 2, sRGB output.
       4c. scene       — procedural geometry (no asset download), 2 lights. Swap for a GLB
                         (draco/meshopt compressed) when the concept needs a real product.
       4d. conductor   — scroll → progress 0..1 → keyframed pose (rotation, scale, camera z).
                         Native scroll is the source of truth; damping smooths, never leads.
       4e. pointer     — subtle tilt toward the cursor (desktop only, damped).
       4f. render on demand — only render while values are still settling; idle = 0 GPU work.
       4g. visibility  — stop when the track is off-screen or the tab is hidden.
       4h. cleanup     — dispose geometry/material/renderer, remove listeners (route change).
-->
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
</script>
<style>
  /* ── 1. Tokens (demo only) ─────────────────────────────── */
  :root {
    --bg: #e8ecef; --ink: #16202b; --ink-muted: #4a5866; --accent: #1f6f78; --accent-2: #c9d3da;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  h1, h2 { line-height: 1; letter-spacing: -0.02em; margin: 0 0 .4em; }
  h1 { font-size: clamp(2.4rem, 8vw, 6rem); }
  h2 { font-size: clamp(1.6rem, 4vw, 3rem); }
  p { color: var(--ink-muted); line-height: 1.6; max-width: 40ch; }

  /* ── 2. Layout ─────────────────────────────────────────── */
  .track { position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100dvh; margin-bottom: -100vh; margin-bottom: -100dvh; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .fallback { position: absolute; inset: 0; display: none; place-items: center; }
  .fallback span { width: min(40vw, 280px); aspect-ratio: 1; border-radius: 30%; background: var(--accent); transform: rotate(18deg); }
  .no-webgl .fallback { display: grid; }
  .chapter { position: relative; min-height: 100vh; display: grid; align-content: center; padding: 0 6vw; pointer-events: none; }
  .chapter:nth-child(even) { justify-items: end; text-align: right; }
  .chapter > div { pointer-events: auto; max-width: 30ch; }
  /* Phones: the object sits behind the text, so the text gets a plate at the bottom of the screen. */
  @media (max-width: 767px) {
    .chapter { align-content: end; padding-bottom: 8vh; }
    .chapter:nth-child(even) { justify-items: start; text-align: left; }
    .chapter > div { background: rgb(232 236 239 / .86); padding: 1rem 1.2rem; border-radius: 6px; }
  }
  .after { min-height: 60vh; padding: 10vh 6vw; }
  @media (prefers-reduced-motion: reduce) { .stage { position: relative; height: 70vh; margin-bottom: 0; } }
</style>
</head>
<body>
  <!-- ── 3. Markup ──────────────────────────────────────────── -->
  <div class="track" id="track">
    <div class="stage" aria-hidden="true">
      <canvas id="gl"></canvas>
      <div class="fallback"><span></span></div>
    </div>
    <section class="chapter"><div><h1>Object</h1><p>Scroll turns it. Move the pointer to tilt it.</p></div></section>
    <section class="chapter"><div><h2>Facet</h2><p>Pose is keyframed against scroll progress, then damped.</p></div></section>
    <section class="chapter"><div><h2>Release</h2><p>Idle frames cost nothing: rendering stops when values settle.</p></div></section>
  </div>
  <section class="after"><h2>After</h2><p>The canvas stops rendering once the track leaves the viewport.</p></section>

<script type="module">
  import * as THREE from 'three';

  const canvas = document.getElementById('gl');
  const track = document.getElementById('track');
  const css = getComputedStyle(document.documentElement);
  const token = (n) => new THREE.Color(css.getPropertyValue(n).trim());
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = matchMedia('(pointer: fine)').matches;

  // ── 4a. Capability check ──────────────────────────────────
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: devicePixelRatio < 2, alpha: true, powerPreference: 'high-performance' }); }
  catch { document.documentElement.classList.add('no-webgl'); throw new Error('WebGL unavailable — static fallback shown'); }

  // ── 4b. Renderer ──────────────────────────────────────────
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // ── 4c. Scene ─────────────────────────────────────────────
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  const group = new THREE.Group();
  scene.add(group);
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const mat = new THREE.MeshStandardMaterial({ color: token('--accent'), roughness: 0.35, metalness: 0.25, flatShading: true });
  const mesh = new THREE.Mesh(geo, mat);
  const ringGeo = new THREE.TorusGeometry(1.6, 0.012, 8, 160);
  const ringMat = new THREE.MeshBasicMaterial({ color: token('--ink') });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  group.add(mesh, ring);
  scene.add(new THREE.HemisphereLight(token('--accent-2'), token('--ink'), 1.4));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 4, 5); scene.add(key);

  // ── 4d. Conductor: progress → pose keyframes ──────────────
  const KEYS = [   // p, rotY, rotX, scale, camZ, ringTilt
    [0.00, 0.0, 0.2, 1.00, 6.0, 1.2],
    [0.50, 2.4, 0.9, 1.25, 5.0, 0.3],
    [1.00, 4.6, 0.1, 0.85, 6.6, 1.5],
  ];
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => t * t * (3 - 2 * t);                    // smoothstep between keys
  function poseAt(p) {
    let i = 0; while (i < KEYS.length - 2 && p > KEYS[i + 1][0]) i++;
    const [a, b] = [KEYS[i], KEYS[i + 1]];
    const t = ease(Math.min(1, Math.max(0, (p - a[0]) / (b[0] - a[0]))));
    return a.slice(1).map((v, k) => lerp(v, b[k + 1], t));
  }
  function scrollProgress() {
    const r = track.getBoundingClientRect();
    const d = r.height - innerHeight;
    return d > 0 ? Math.min(1, Math.max(0, -r.top / d)) : 0;
  }

  // ── 4e. Pointer tilt ──────────────────────────────────────
  const pointer = { x: 0, y: 0 };
  const onPointer = (e) => { pointer.x = e.clientX / innerWidth - 0.5; pointer.y = e.clientY / innerHeight - 0.5; wake(); };
  if (finePointer && !reduce) addEventListener('pointermove', onPointer, { passive: true });

  // ── 4f. Render on demand with damping ─────────────────────
  const state = poseAt(reduce ? 0.5 : scrollProgress()).concat([0, 0]);   // + tiltX, tiltY
  let rafId = 0, visible = true;
  function apply() {
    const [rotY, rotX, scale, camZ, ringTilt, tx, ty] = state;
    group.rotation.set(rotX + ty * 0.35, rotY + tx * 0.5, 0);
    mesh.scale.setScalar(scale);
    ring.rotation.x = ringTilt;
    camera.position.set(0, 0, camZ);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  }
  function frame() {
    rafId = 0;
    const target = poseAt(scrollProgress()).concat([pointer.x, pointer.y]);
    let moving = false;
    for (let i = 0; i < state.length; i++) {
      state[i] += (target[i] - state[i]) * 0.12;              // damping (≈ scrub 0.5)
      if (Math.abs(target[i] - state[i]) > 1e-4) moving = true; else state[i] = target[i];
    }
    apply();
    document.documentElement.dataset.p = scrollProgress().toFixed(2);
    if (moving) wake();
  }
  function wake() { if (!rafId && visible && !reduce) rafId = requestAnimationFrame(frame); }

  function resize() {
    const { width, height } = canvas.getBoundingClientRect();
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    // Portrait screens: shrink the whole object so it fits the narrow frustum.
    group.scale.setScalar(camera.aspect < 1 ? Math.max(0.55, camera.aspect * 1.05) : 1);
    apply();
  }
  resize();
  addEventListener('resize', resize);
  if (!reduce) addEventListener('scroll', wake, { passive: true });

  // ── 4g. Visibility ────────────────────────────────────────
  const io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible) wake(); });
  io.observe(track);
  const onVis = () => { visible = !document.hidden; if (visible) wake(); };
  document.addEventListener('visibilitychange', onVis);
  document.documentElement.dataset.glReady = '1';

  // ── 4h. Cleanup ───────────────────────────────────────────
  window.__glCleanup = () => {
    cancelAnimationFrame(rafId); io.disconnect();
    removeEventListener('scroll', wake); removeEventListener('resize', resize); removeEventListener('pointermove', onPointer);
    document.removeEventListener('visibilitychange', onVis);
    geo.dispose(); mat.dispose(); ringGeo.dispose(); ringMat.dispose(); renderer.dispose();
  };
</script>
</body>
</html>
