<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll-scrubbed video</title>
<!--
  DEMO: scroll position → video.currentTime, no libraries.

  Section map
    1. Tokens          — demo values; replace with the project's tokens.css (Phase 5).
    2. Layout          — a tall "track" with a sticky stage (pins without JS).
    3. Markup          — <video> with the attributes iOS needs + poster.
    4. Script
       4a. pick asset  — mobile vs desktop file, WebM vs MP4.
       4b. load        — fetch whole file into a Blob (instant seeks, no range requests).
       4c. progress    — scroll → 0..1 for the track.
       4d. scrub loop  — rAF + smoothing; only seek when the previous seek finished.
       4e. iOS unlock  — play()/pause() once on first touch so Safari paints seeks.
       4f. reduced motion / failure — poster only, no pin.

  Asset: an ALL-KEYFRAME encode from ../prepare-scrub-video.sh. A normal encode
  will stutter because every seek decodes from the previous keyframe.
-->
<style>
  /* ── 1. Tokens (demo only) ─────────────────────────────── */
  :root {
    --bg: #e8ecef; --ink: #16202b; --ink-muted: #4a5866; --accent: #1f6f78;
    --line: rgb(22 32 43 / .18);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  section.copy { min-height: 70vh; display: grid; place-content: center; padding: 10vh 6vw; max-width: 60ch; margin: 0 auto; }
  h1 { font-size: clamp(2rem, 6vw, 4.5rem); line-height: 1; margin: 0 0 .4em; letter-spacing: -0.02em; }
  p { color: var(--ink-muted); line-height: 1.6; }

  /* ── 2. Layout: track + sticky stage ───────────────────── */
  /* Track height = scroll distance of the scrub. 300vh ≈ 3 screens for a 4s clip. */
  .scrub-track { position: relative; height: 300vh; }
  .scrub-stage {
    position: sticky; top: 0; height: 100vh; height: 100dvh;   /* dvh: no jump when iOS toolbars move */
    display: grid; place-items: center; overflow: hidden;
  }
  .scrub-stage video {
    width: 100%; height: 100%; object-fit: cover; display: block;
    background: var(--ink);                                  /* shows while the first frame decodes */
  }
  .scrub-caption {
    position: absolute; left: 6vw; bottom: 8vh; margin: 0; max-width: 28ch;
    color: #f4f6f8; font-size: clamp(1.1rem, 2.4vw, 1.6rem); line-height: 1.3;
    opacity: var(--caption-o, 0); transform: translateY(calc((1 - var(--caption-o, 0)) * 12px));
  }
  .readout { position: absolute; top: 16px; right: 16px; font: 12px/1 var(--font); color: #f4f6f8; opacity: .7; }

  /* ── 4f. Reduced motion: no pin, no scrub, poster only ─── */
  @media (prefers-reduced-motion: reduce) {
    .scrub-track { height: auto; }
    .scrub-stage { position: relative; height: 70vh; }
    .scrub-caption { --caption-o: 1; }
  }
  .is-static .scrub-track { height: auto; }
  .is-static .scrub-stage { position: relative; height: 70vh; }
  .is-static .scrub-caption { --caption-o: 1; }
</style>
</head>
<body>
  <section class="copy">
    <h1>Scroll to scrub</h1>
    <p>The clip below is driven by scroll position. Scroll down to move forward, up to move back.</p>
  </section>

  <!-- ── 3. Markup ─────────────────────────────────────────
       muted + playsinline : required for iOS to render inline without fullscreen
       preload="auto"      : hint to fetch; we also fetch manually (4b)
       poster              : first frame — instant paint, LCP candidate, reduced-motion still
       aria-hidden         : decorative; the caption carries the meaning -->
  <div class="scrub-track" id="track">
    <div class="scrub-stage">
      <video id="scrub" muted playsinline preload="auto" aria-hidden="true"
             poster="assets/video/sample-poster.webp"></video>
      <p class="scrub-caption" id="caption">Every frame is a keyframe, so every scroll position is one cheap decode.</p>
      <span class="readout" id="readout" aria-hidden="true">t = 0.00s</span>
    </div>
  </div>

  <section class="copy">
    <h1>After the scrub</h1>
    <p>Normal flow resumes once the track ends.</p>
  </section>

<script>
(() => {
  const video = document.getElementById('scrub');
  const track = document.getElementById('track');
  const caption = document.getElementById('caption');
  const readout = document.getElementById('readout');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // ── 4a. Pick the asset ────────────────────────────────────
  // Smaller file under 768px; WebM (VP9) where supported, MP4 (H.264) everywhere else (Safari).
  const isMobile = window.matchMedia('(max-width: 767px)').matches;
  const base = `assets/video/sample-${isMobile ? 'mobile' : 'desktop'}`;
  const canWebm = video.canPlayType('video/webm; codecs="vp9"') === 'probably';
  const src = `${base}.${canWebm ? 'webm' : 'mp4'}`;

  // ── 4f. Reduced motion: keep the poster, skip the whole scrub ──
  if (reduce.matches) { document.documentElement.classList.add('is-static'); return; }

  // ── 4b. Load the whole file as a Blob ─────────────────────
  // Seeking a Blob URL never waits on the network, which removes most scrub stutter.
  // Keep the file small (see budgets in scroll-video-interaction.md) — it all lands in memory.
  let objectUrl = null;
  fetch(src)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(blob => { objectUrl = URL.createObjectURL(blob); video.src = objectUrl; })
    .catch(() => { video.src = src; });                       // fallback: stream normally
  video.addEventListener('error', () => document.documentElement.classList.add('is-static'));

  // ── 4c. Scroll → progress (0..1) across the track ─────────
  function progress() {
    const r = track.getBoundingClientRect();
    const distance = r.height - window.innerHeight;
    return distance > 0 ? Math.min(1, Math.max(0, -r.top / distance)) : 0;
  }

  // ── 4d. Scrub loop ────────────────────────────────────────
  // target = where scroll says we should be; current = eased toward it (smoothing 0.15 ≈ GSAP scrub: 0.5).
  // Only issue a new seek when the last one finished (video.seeking === false) — stacking
  // seeks is the #1 cause of lag on Safari.
  let current = 0, running = true, rafId = 0;
  const SMOOTH = 0.15;
  function tick() {
    if (!running) return;
    const p = progress();
    caption.style.setProperty('--caption-o', Math.min(1, Math.max(0, (p - 0.55) / 0.2)).toFixed(3));
    if (video.duration) {
      const target = p * (video.duration - 0.05);
      current += (target - current) * SMOOTH;
      if (Math.abs(target - current) < 0.001) current = target;
      if (!video.seeking && Math.abs(video.currentTime - current) > 0.01) video.currentTime = current;
      readout.textContent = `t = ${current.toFixed(2)}s`;
    }
    rafId = requestAnimationFrame(tick);
  }

  // Pause the loop while the track is off-screen (battery + main-thread budget).
  new IntersectionObserver(([entry]) => {
    running = entry.isIntersecting;
    cancelAnimationFrame(rafId);
    if (running) rafId = requestAnimationFrame(tick);
  }).observe(track);

  // ── 4e. iOS unlock ────────────────────────────────────────
  // Some iOS versions won't paint seeks until the element has played once.
  const unlock = () => { video.play().then(() => video.pause()).catch(() => {}); };
  window.addEventListener('touchstart', unlock, { once: true, passive: true });

  // Cleanup hook for SPAs (call on route change).
  window.__scrubCleanup = () => { running = false; cancelAnimationFrame(rafId); if (objectUrl) URL.revokeObjectURL(objectUrl); };
})();
</script>
</body>
</html>
